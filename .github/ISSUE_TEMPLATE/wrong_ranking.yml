name: Wrong ranking
description: An item sits higher or lower in the list than it should, or its reason is wrong.
title: "ranking: "
labels: ["ranking"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: Name and, if known, the item id.
      placeholder: "Crisp Spring Water (159)"
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Class and level
      placeholder: "Hunter, level 28"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Where the item should sit and why. The line under the item in the list, and the sell price from the tooltip, help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: /jettison why output
      description: Hover the item in the list and type /jettison why followed by part of its name, then paste the chat lines here. They hold ids and numbers only.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no character names, realm names or account details.
          required: true
